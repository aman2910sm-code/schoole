  <path d="M 330 325 L 330 527 L 450 527" stroke="#B45309" stroke-width="2" fill="none"/>
  <path d="M 580 527 L 880 527 L 880 650" stroke="#B45309" stroke-width="2" fill="none"/>
  <rect x="340" y="420" width="20" height="18" fill="#FFFFFF"/>
