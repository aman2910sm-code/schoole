<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management System — ER Diagram Part 1 Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .header-title h1 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #059669;
      color: #ffffff;
      font-weight: 600;
    }
    .header-title p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid #475569;
      background: #334155;
      color: #ffffff;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #475569;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .viewport {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #090d16;
    }
    .sheet-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 1400px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>School Management System — ER Diagram Part 1 <span class="badge">Academic Hierarchy</span></h1>
      <p>Editable File: School_Management_ER_Part1.drawio | Tables: grades, section, class | Source: DATA_DICTIONARY.md</p>
    </div>
    <div class="actions">
      <a href="School_Management_ER_Part1.drawio" download class="btn btn-primary">Download .drawio File</a>
      <a href="https://app.diagrams.net/" target="_blank" class="btn">Open in diagrams.net</a>
    </div>
  </header>

  <div class="viewport">
    <div class="sheet-card">
      <img src="School_Management_ER_Part1.svg" alt="School Management ER Diagram Part 1" />
    </div>
  </div>
</body>
</html>
