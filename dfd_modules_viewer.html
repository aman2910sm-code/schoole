<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 1 DFD (Functional Decomposition) | School Management System</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #475569;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: #1e293b;
      padding: 14px 24px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      border-bottom: 2px solid #334155;
    }
    .header-title h1 {
      margin: 0;
      font-size: 1.15rem;
    }
    .header-title p {
      margin: 4px 0 0 0;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #475569;
      color: #ffffff;
    }
    .nav-btn.active {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
    }
    .actions a {
      background: #2563eb;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .actions a:hover {
      background: #1d4ed8;
    }
    main {
      padding: 30px 10px;
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: center;
    }
    .sheet-card {
      background: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 900px;
      border-radius: 4px;
      overflow: hidden;
    }
    .panel {
      display: none;
      width: 100%;
    }
    .panel.active {
      display: block;
    }
    .panel object, .panel img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Level 1 DFD (Functional Decomposition) — Black &amp; White Report Format</h1>
      <p>School Management System | Entity (Rectangle), Process (Oval), Data Store (Open Box)</p>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active" onclick="showTab('admin')">Admin DFD</button>
      <button class="nav-btn" onclick="showTab('teacher')">Teacher DFD</button>
      <button class="nav-btn" onclick="showTab('student')">Student DFD</button>
      <button class="nav-btn" onclick="showTab('registrar')">Registrar DFD</button>
    </div>

    <div class="actions">
      <a id="download-drawio" href="admin.drawio" download>Download .drawio</a>
    </div>
  </header>

  <main>
    <div class="sheet-card">
      <div id="tab-admin" class="panel active">
        <object data="admin_dfd.svg" type="image/svg+xml"></object>
      </div>
      <div id="tab-teacher" class="panel">
        <object data="teacher_dfd.svg" type="image/svg+xml"></object>
      </div>
      <div id="tab-student" class="panel">
        <object data="student_dfd.svg" type="image/svg+xml"></object>
      </div>
      <div id="tab-registrar" class="panel">
        <object data="registrar_dfd.svg" type="image/svg+xml"></object>
      </div>
    </div>
  </main>

  <script>
    function showTab(name) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('download-drawio').href = name + '.drawio';
      document.getElementById('download-drawio').setAttribute('download', name + '.drawio');
    }
  </script>
</body>
</html>
