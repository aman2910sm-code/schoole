<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entity-Relationship (ER) Diagram Viewer</title>
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #38BDF8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-left p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .tabs-group {
      display: flex;
      background: #0F172A;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #2563EB;
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: var(--card-bg);
      color: #F8FAFC;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn:hover { background: #334155; border-color: #64748B; }
    .btn-primary { background: #2563EB; border-color: #3B82F6; color: #FFFFFF; }
    .btn-primary:hover { background: #1D4ED8; }
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #E2E8F0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }
    iframe {
      border: none;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      background: #FFFFFF;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Entity-Relationship (ER) Diagram Viewer</h1>
      <p>Chen ER Notation Standard &bull; Editable in draw.io &bull; College Project Ready</p>
    </div>
    <div class="tabs-group">
      <button class="tab-btn active" onclick="switchTab('sms')">1. School Management System ERD</button>
      <button class="tab-btn" onclick="switchTab('ecommerce')">2. Reference E-Commerce ERD</button>
    </div>
    <div class="header-actions">
      <a href="school_management_er_diagram.drawio" download class="btn btn-primary" title="Download editable draw.io diagram file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download .drawio
      </a>
      <a href="https://app.diagrams.net/" target="_blank" class="btn" title="Open diagrams.net online editor">
        Open in draw.io
      </a>
    </div>
  </header>

  <div class="viewport">
    <div class="diagram-container" id="container-sms">
      <iframe src="sms_er_diagram.svg" style="width: 2400px; height: 1800px;"></iframe>
    </div>
    <div class="diagram-container" id="container-ec" style="display: none;">
      <iframe src="ecommerce_er_diagram.svg" style="width: 1800px; height: 1200px;"></iframe>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'sms') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('container-sms').style.display = 'flex';
        document.getElementById('container-ec').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('container-sms').style.display = 'none';
        document.getElementById('container-ec').style.display = 'flex';
      }
    }
  </script>
</body>
</html>
