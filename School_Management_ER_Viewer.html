<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management System — Unified ER Diagram Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .header-title h1 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #059669;
      color: #ffffff;
      font-weight: 600;
    }
    .header-title p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid #475569;
      background: #334155;
      color: #ffffff;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #475569;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .viewport {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #090d16;
    }
    .sheet-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 3500px;
      transform-origin: top center;
      transition: transform 0.15s ease-out;
    }
    object {
      display: block;
      width: 100%;
      height: 2500px;
    }
    .zoom-controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 6px;
      background: rgba(30, 41, 59, 0.9);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #475569;
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    .zoom-btn {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .zoom-btn:hover {
      background: #334155;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>
        Unified School Management System ER Diagram
        <span class="badge">All 12 Tables Combined</span>
      </h1>
      <p>Peter Chen Notation &bull; Pure Black &amp; White &bull; All PKs and FKs Linked &bull; College Project Documentation</p>
    </div>

    <div class="actions">
      <a href="School_Management_Unified_ER.drawio" download class="btn btn-primary" title="Download editable draw.io diagram">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download .drawio
      </a>
      <a href="https://app.diagrams.net/" target="_blank" class="btn" title="Open diagrams.net online editor">
        Open in draw.io
      </a>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <div class="sheet-card" id="card">
      <object data="School_Management_Unified_ER.svg" type="image/svg+xml" id="svg-object"></object>
    </div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">+</button>
    <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">&minus;</button>
    <button class="zoom-btn" onclick="resetZoom()" title="Reset Zoom">100%</button>
  </div>

  <script>
    let scale = 1.0;
    const card = document.getElementById('card');

    function zoomIn() {
      scale += 0.15;
      applyZoom();
    }
    function zoomOut() {
      if (scale > 0.3) {
        scale -= 0.15;
        applyZoom();
      }
    }
    function resetZoom() {
      scale = 1.0;
      applyZoom();
    }
    function applyZoom() {
      card.style.transform = `scale(${scale})`;
      card.style.transformOrigin = 'top center';
    }
  </script>
</body>
</html>
